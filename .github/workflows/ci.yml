name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck busybox-static cpio kmod zstd xz-utils gcc
      - name: Lint and smoke test
        run: make check
